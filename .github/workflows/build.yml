name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test replay buffer and MP4 export
        run: swift test
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build universal DMG
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BackToBug-macOS
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --title "Back to Bug ${GITHUB_REF_NAME#v}" --notes "Rolling screen replays for macOS. Download the DMG, drag Back to Bug to Applications, and allow Screen Recording. This build is ad-hoc signed; use Privacy & Security → Open Anyway on first launch."
    permissions:
      contents: write
